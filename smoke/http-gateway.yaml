---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: smoke-gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: smoke-route
  namespace: istio-system
spec:
  parentRefs:
    - name: smoke-gateway
      namespace: istio-system
  rules:
    - backendRefs:
        - name: smoke-nginx
          port: 80
