apiVersion: v1
kind: ConfigMap
metadata:
  name: smoke-gateway-options
  namespace: istio-system
data:
  deployment: |
    spec:
      replicas: 1
  service: |
    spec:
      # If LoadBalancer , it won't become Ready. No Load Balaning solution inside the cluster
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: smoke-gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: smoke-gateway-options
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: smoke-route
  namespace: istio-system
spec:
  parentRefs:
    - name: smoke-gateway
      namespace: istio-system
  rules:
    - backendRefs:
        - name: smoke-nginx
          port: 80
