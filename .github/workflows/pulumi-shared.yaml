# =============================================================================
# .github/workflows/pulumi-shared.yaml — shared infrastructure pipeline
# =============================================================================
# Runs on every push to main that touches pulumi-shared/.
#
# Prerequisites (Appendix A):
#   - GitHub self-hosted runner registered with label: local_laptop_runner
#   - pulumi CLI installed on runner
#   - GitHub Environment "shared" configured with required reviewers
#   - Repository secret: BWS_ACCESS_TOKEN
# =============================================================================

name: Pulumi Shared

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pulumi-shared/**"
      - ".github/workflows/pulumi-shared.yaml"

jobs:
  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv virtual environment
        uses: actions/cache@v4
        with:
          path: pulumi-shared/.venv
          key: uv-venv-${{ runner.os }}-${{ hashFiles('pulumi-shared/uv.lock') }}
          restore-keys: uv-venv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --project pulumi-shared/

      - name: Check code formatting with black
        run: uv run --project pulumi-shared/ black --check --diff pulumi-shared/ --extend-exclude '/\.scripts/'

      - name: Type check with mypy
        run: uv run --project pulumi-shared/ mypy pulumi-shared/ --ignore-missing-imports --exclude 'pulumi-shared/\.scripts'

  # ── Static analysis ───────────────────────────────────────────────────────────
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv virtual environment
        uses: actions/cache@v4
        with:
          path: pulumi-shared/.venv
          key: uv-venv-${{ runner.os }}-${{ hashFiles('pulumi-shared/uv.lock') }}
          restore-keys: uv-venv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --project pulumi-shared/

      - name: Lint with ruff
        run: uv run --project pulumi-shared/ ruff check pulumi-shared/ --extend-exclude '/\.scripts/'

      - name: Security scan with bandit
        run: uv run --project pulumi-shared/ bandit -r pulumi-shared/ -ll --exclude pulumi-shared/.venv,pulumi-shared/.scripts

  # ── Pulumi preview ───────────────────────────────────────────────────────────
  preview-shared:
    runs-on: ubuntu-latest
    needs: [lint-code, static-analysis]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv virtual environment
        uses: actions/cache@v4
        with:
          path: pulumi-shared/.venv
          key: uv-venv-${{ runner.os }}-${{ hashFiles('pulumi-shared/uv.lock') }}
          restore-keys: uv-venv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --project pulumi-shared/

      - name: Fetch secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.eu
          secrets: |
            f5789e30-d191-4558-b135-b4a100c506ee > PULUMI_ACCESS_TOKEN

      - name: Run Pulumi preview
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: Jdavid77/pulumi-shared/shared
          color: always
          work-dir: pulumi-shared
        env:
          PULUMI_ACCESS_TOKEN: ${{ env.PULUMI_ACCESS_TOKEN }}

  # ── Manual approval gate ──────────────────────────────────────────────────────
  approve-shared:
    runs-on: ubuntu-latest
    needs: preview-shared
    environment: shared
    steps:
      - name: Await manual approval
        run: echo "Deployment approved"

  # ── Deploy ───────────────────────────────────────────────────────────────────
  update-shared:
    runs-on: ubuntu-latest
    needs: approve-shared
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv virtual environment
        uses: actions/cache@v4
        with:
          path: pulumi-shared/.venv
          key: uv-venv-${{ runner.os }}-${{ hashFiles('pulumi-shared/uv.lock') }}
          restore-keys: uv-venv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --project pulumi-shared/

      - name: Fetch secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.eu
          secrets: |
            f5789e30-d191-4558-b135-b4a100c506ee > PULUMI_ACCESS_TOKEN

      - name: Run Pulumi up
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: Jdavid77/pulumi-shared/shared
          color: always
          work-dir: pulumi-shared
        env:
          PULUMI_ACCESS_TOKEN: ${{ env.PULUMI_ACCESS_TOKEN }}
