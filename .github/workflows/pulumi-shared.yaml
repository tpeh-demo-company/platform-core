# =============================================================================
# .github/workflows/pulumi-shared.yaml — shared infrastructure pipeline
# =============================================================================
# Runs on every push to main that touches pulumi-shared/.
#
# Prerequisites (Appendix A):
#   - GitHub self-hosted runner registered with label: local_laptop_runner
#   - pulumi CLI installed on runner
#   - GitHub Environment "shared" configured with required reviewers
#   - Repository secret: BWS_ACCESS_TOKEN
# =============================================================================

name: Pulumi Shared

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pulumi-shared/**"
      - ".github/workflows/pulumi-shared.yaml"

jobs:
  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    uses: ./.github/workflows/lint.yaml
    with:
      project_dir: pulumi-shared
      extra_exclude: pulumi-shared/.scripts

  # ── Pulumi preview ───────────────────────────────────────────────────────────
  preview-shared:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv virtual environment
        uses: actions/cache@v4
        with:
          path: pulumi-shared/.venv
          key: uv-venv-${{ runner.os }}-${{ hashFiles('pulumi-shared/uv.lock') }}
          restore-keys: uv-venv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --project pulumi-shared/

      - name: Fetch secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.eu
          secrets: |
            f5789e30-d191-4558-b135-b4a100c506ee > PULUMI_ACCESS_TOKEN

      - name: Run Pulumi preview
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: Jdavid77/pulumi-shared/shared
          color: always
          work-dir: pulumi-shared
        env:
          PULUMI_ACCESS_TOKEN: ${{ env.PULUMI_ACCESS_TOKEN }}

  # ── Manual approval gate ──────────────────────────────────────────────────────
  approve-shared:
    runs-on: ubuntu-latest
    needs: preview-shared
    environment: shared
    steps:
      - name: Await manual approval
        run: echo "Deployment approved"

  # ── Deploy ───────────────────────────────────────────────────────────────────
  update-shared:
    runs-on: ubuntu-latest
    needs: approve-shared
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv virtual environment
        uses: actions/cache@v4
        with:
          path: pulumi-shared/.venv
          key: uv-venv-${{ runner.os }}-${{ hashFiles('pulumi-shared/uv.lock') }}
          restore-keys: uv-venv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --project pulumi-shared/

      - name: Fetch secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.eu
          secrets: |
            f5789e30-d191-4558-b135-b4a100c506ee > PULUMI_ACCESS_TOKEN

      - name: Run Pulumi up
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: Jdavid77/pulumi-shared/shared
          color: always
          work-dir: pulumi-shared
        env:
          PULUMI_ACCESS_TOKEN: ${{ env.PULUMI_ACCESS_TOKEN }}

  # ── Validate ─────────────────────────────────────────────────────────────────
  validate-shared:
    runs-on: ubuntu-latest
    needs: update-shared
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.eu
          secrets: |
            242f7850-9585-42ae-89b9-b4a100e5d726 > AUTH0_CLIENT_ID
            aa8202a8-c631-4163-9302-b4a100e5d7d9 > AUTH0_CLIENT_SECRET
            43b53dc4-6cc1-4297-a856-b4a500aaca4d > CF_API_TOKEN
            4e01704e-6e90-463f-894c-b4a500aac920 > CF_ACCOUNT_ID
            f315ca37-e323-4a6c-8524-b4a500aac9be > CF_ZONE_ID

      - name: Load config from Pulumi stack file
        run: |
          cfg=pulumi-shared/Pulumi.shared.yaml
          {
            echo "AUTH0_DOMAIN=$(yq '.config["auth0:domain"]' $cfg)"
            echo "DOMAIN=$(yq '.config["pulumi-shared:domain"]' $cfg)"
            echo "CLUSTERS=$(yq '.config["pulumi-shared:clusters"] | join(" ")' $cfg)"
          } >> "$GITHUB_ENV"

      - name: Install bats
        run: npm install -g bats

      - name: Run shared infrastructure tests
        working-directory: pulumi-shared
        run: bats tests/shared.bats
